# Render Blueprint Specification for Indian Monopoly Production Service
# Free Web Service running Node.js + Socket.IO Authoritative Backend + Built React App
# Backed by Supabase PostgreSQL 17 Database with ACID transaction isolation.
# Docs: https://render.com/docs/blueprint-spec

services:
  # Singapore is the closest Render region to players in India and to the Supabase
  # database in Mumbai (ap-south-1). Oregon added ~230 ms to every action.
  - type: web
    name: monopoly-india-server-sg
    runtime: node
    branch: feature/render-public-hosting
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BOT_TAKEOVER_GRACE_MS
        value: "10000"
      - key: CLIENT_ORIGIN
        sync: false
