# Render Blueprint Specification for Indian Monopoly Production Service
# Free Web Service running Node.js + Socket.IO Authoritative Backend + Built React App
# Backed by Supabase PostgreSQL 17 Database with ACID transaction isolation.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: monopoly-india-server
    runtime: node
    branch: feature/render-public-hosting
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BOT_TAKEOVER_GRACE_MS
        value: "10000"
      - key: CLIENT_ORIGIN
        sync: false
