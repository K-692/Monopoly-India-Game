<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <linearGradient id="bg_jal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="jal_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <rect width="200" height="240" fill="url(#bg_jal)" />
  <!-- Hydro Water Reservoir, Dam & Ripple Waves Motif -->
  <g opacity="0.22" transform="translate(25, 45)">
    <!-- Water Drops in Hexagon Grid -->
    <path d="M75,15 C60,40 50,60 50,75 C50,90 61,102 75,102 C89,102 100,90 100,75 C100,60 90,40 75,15 Z" fill="url(#jal_blue)" />
    <!-- Dynamic Reservoir Waves -->
    <path d="M15,115 C35,105 55,125 75,115 C95,105 115,125 135,115" stroke="url(#jal_blue)" stroke-width="4" stroke-linecap="round" fill="none" />
    <path d="M15,128 C35,118 55,138 75,128 C95,118 115,138 135,128" stroke="url(#jal_blue)" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>
</svg>
