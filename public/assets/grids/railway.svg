<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <linearGradient id="bg_rail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="rail_blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>
  <rect width="200" height="240" fill="url(#bg_rail)" />
  <!-- Express Indian Locomotive on Parallel Tracks Motif -->
  <g opacity="0.22" transform="translate(30, 45)">
    <!-- Engine Body -->
    <rect x="35" y="15" width="70" height="70" rx="14" fill="url(#rail_blue)" />
    <rect x="42" y="25" width="24" height="20" rx="3" fill="#ffffff" />
    <rect x="74" y="25" width="24" height="20" rx="3" fill="#ffffff" />
    <circle cx="48" cy="68" r="7" fill="#fbbf24" />
    <circle cx="92" cy="68" r="7" fill="#fbbf24" />
    <rect x="62" y="65" width="16" height="8" rx="2" fill="#ef4444" />
    <!-- Tracks -->
    <path d="M40,95 L15,135 M100,95 L125,135" stroke="url(#rail_blue)" stroke-width="5" stroke-linecap="round" />
    <path d="M22,125 L118,125" stroke="url(#rail_blue)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M30,110 L110,110" stroke="url(#rail_blue)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M38,98 L102,98" stroke="url(#rail_blue)" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
