<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <linearGradient id="bg_civic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#fef3c7" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="civic_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <rect width="200" height="240" fill="url(#bg_civic)" />
  <!-- Treasury Vault / Classical Colonnade Motif -->
  <g opacity="0.22" transform="translate(20, 40)">
    <!-- Pediment -->
    <polygon points="80,10 10,45 150,45" fill="url(#civic_gold)" />
    <rect x="18" y="45" width="124" height="8" rx="2" fill="url(#civic_gold)" />
    <!-- Pillars -->
    <rect x="25" y="55" width="14" height="65" rx="3" fill="url(#civic_gold)" />
    <rect x="52" y="55" width="14" height="65" rx="3" fill="url(#civic_gold)" />
    <rect x="79" y="55" width="14" height="65" rx="3" fill="url(#civic_gold)" />
    <rect x="106" y="55" width="14" height="65" rx="3" fill="url(#civic_gold)" />
    <rect x="133" y="55" width="14" height="65" rx="3" fill="url(#civic_gold)" />
    <!-- Base -->
    <rect x="14" y="120" width="132" height="12" rx="2" fill="url(#civic_gold)" />
    <!-- Treasury Shield / Seal -->
    <circle cx="80" cy="85" r="22" fill="#b45309" fill-opacity="0.3" stroke="url(#civic_gold)" stroke-width="3" />
    <path d="M72,85 L78,92 L90,78" stroke="url(#civic_gold)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
