      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        } else if (l.hash.indexOf('#/') === 0) {
          var base = l.pathname.charAt(l.pathname.length - 1) === '/' ? l.pathname : l.pathname + '/';
          window.history.replaceState(null, '', base + l.hash.slice(2));
        }
      })(window.location);
