name: Deploy Monopoly India to GitHub Pages

on:
  push:
    branches:
      - feature/render-public-hosting
  workflow_dispatch:

# Set required permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent concurrent deployments
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Verify VITE_SERVER_URL repository variable
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
        run: |
          if [ -z "$VITE_SERVER_URL" ]; then
            echo "::error title=Missing VITE_SERVER_URL::Repository Actions variable 'VITE_SERVER_URL' is missing! Please configure 'VITE_SERVER_URL' in GitHub Repository Settings -> Secrets and variables -> Actions -> Variables with your Render backend URL (e.g. https://monopoly-india-server.onrender.com)."
            exit 1
          fi
          echo "Verified VITE_SERVER_URL is configured."

      - name: Install dependencies
        run: npm ci

      - name: Build frontend for GitHub Pages
        env:
          VITE_SERVER_URL: ${{ vars.VITE_SERVER_URL }}
          VITE_APP_BASE_PATH: /Monopoly-India-Game/
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

